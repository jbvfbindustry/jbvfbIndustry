# JBV Group - Nginx HTTP Web Server Configuration
# Domain: jbvfbindustry.in
# Plain HTTP Configuration (Port 80, No SSL / No Encrypt Certificate Required)

server {
    listen 80;
    listen [::]:80;
    server_name jbvfbindustry.in www.jbvfbindustry.in;

    root /var/www/jbv_group_website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 404 /index.html;
}
